name: golden

on:
  push:
    branches: [dengjen]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      ESPEAK_DATA_PATH: ${{ github.workspace }}/espeak-ng-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build release
        run: cargo build --release
      - name: Library tests
        run: cargo test --lib
      - name: Fix-branch tests
        run: >
          cargo test --release
          --test cli_invalid_utf8
          --test cli_data_path
          --test cli_voice_path
          --test cli_voices_list
          --test cli_getopt
          --test cli_messages
          --test cli_voice_select
          --test cli_punct
          --test dictionary_bounds
          --test english_letter_group_y
          --test italian_rule_stress
          --test faroese_default_stress
          --test hbs_spelling_stress
          --test spelling_stress_langs
          --test time_colon_rule
          --test trailing_clause_marks
          --test punctuation_only_clause
          --test letter_name_conditions
          --test ligurian_halflong_consonant
          --test ligurian_halflong_next_word
          --test question_exclamation_run
          --test polish_final_l
          --test long_digit_strings
          --test spanish_group_stress
          --test pt_articles
          --test portuguese_numbers
          --test ipa_from_codes
          --test upstream_1_53_parity
          --test geminates_and_alt_vowels
          --test ku_hundred_link
          --test ku_tr_ru_golden
          --test my_asat_marks
          --test tone_later_replaces
          --test my_tone_only_word
          --test digits_without_number_grammar
          --test shn_my_script_words
          --test vi_final_tone_and_vowels
          --test ru_voice_replace
          --test unspaced_ascii_punctuation
          --test dot_run_ellipsis
          --test robustness_tone_sandhi
          --test robustness_linear_time
          --test robustness_wav_stream
          --test robustness_final_long_stress
          --test robustness_ssml_unterminated_tag
          --test robustness_switch_tables
          --test stress_add_language_table
          --test crash_safety
          --test fuzz_parsers
          --test number_apostrophe_suffix
          --test synth_parity
          --test synth_parity_langs
          --test synth_parity_voicefile
          --test synth_parity_phlist
          --test synth_parity_wordgap
          --test synth_parity_variants
          --test synth_parity_voice_path
          --test synth_parity_ssml_break
          --test ssml_markup_parity
          --test ssml_say_as_unrecognised_modes
          --test ssml_full_stop_before_tag
          --test synth_parity_tone
          --test synth_parity_klatt
          --test synth_parity_next3
          --test synth_parity_clause_pause
          --test synth_parity_punct_pause
          --test synth_parity_clause_type
          --test synth_parity_penultimate
          --test synth_parity_unstressend
          --test tr_phoneme_program_context
          --test tr_next_phoneme_word_end
          --test max_digits
          --test number_group_pause
          --test leading_zero_long_runs
          --test dutch_sch_cluster
          --test dutch_spelled_letters
          --test dutch_pause
          --test dutch_prefix_stress
          --test german_brk_last_word
          --test german_spelled_letters
          --test german_loanword_voicing
          --test dutch_final_devoicing
          --test german_clause_final_devoicing
          --test german_unit_one
          --test dutch_prefix_rule_flags

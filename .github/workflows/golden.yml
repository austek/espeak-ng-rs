          --test italian_golden_fixes
          --test symbol_reading
          --test negative_numbers
          --test number_point
          --test acronym_periods
          --test dotted_abbreviations
          --test dotted_phrase_entries
          --test dot_between_words
          --test hyphen_and_clause_stress
          --test quote_and_dash_pauses
          --test vulgar_fractions
          --test dotted_ordinals
          --test german_ordinals
          --test pt_prev_stress_demotes_primary
          --test pt_spelling_rule_symbol
          --test pt_final_u_glide
          --test pt_underscore_symbols
          --test pt_currency_and_degrees
          --test french_golden_fixes
          --test suffix_keeps_stem_stress
          --test number_single_stress_tens
          --test lengthened_pause_and_repeats
          --test german_prefix_stem_lookup
          --test unpronounceable_next_word
          --test es_unpron_rule_and_roman
          --test letters2
          --test symbol_table_removed
          --test symbol_english_switch
          --test clause_tonic_unstressed_words
          --test clause_leading_punctuation
          --test cmn_phrase_entries
          --test fullwidth_clause_punctuation
          --test cmn_neutral_tone_unstressed
          --test cmn_neutral_tone_level
          --test cmn_pinyin_u_after_palatal
          --test yue_jyutping_voice_rules
          --test yue_list_tone_placement
          --test voice_names
          --test voice_keywords
          --test regressive_voicing_hr
          --test ku_arabic_script_words
          --test sep_lengthen

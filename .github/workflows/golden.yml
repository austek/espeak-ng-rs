name: golden

on:
  push:
    branches: [dengjen]
    tags: ['v*']

jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      ESPEAK_DATA_PATH: ${{ github.workspace }}/espeak-ng-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Library tests
        run: cargo test --lib
      - name: Fix-branch tests
        run: >
          cargo test --release
          --test cli_invalid_utf8
          --test dictionary_bounds
          --test english_letter_group_y
          --test italian_rule_stress
          --test polish_final_l
          --test long_digit_strings
          --test spanish_group_stress
          --test pt_articles
          --test portuguese_numbers
          --test ipa_from_codes
          --test upstream_1_53_parity
          --test geminates_and_alt_vowels
          --test ku_hundred_link
          --test max_digits
          --test number_group_pause
      - name: Switch closing tag tests
        run: cargo test --release --test switch_closing_tag -- --ignored
        env:
          ESPEAK_NG_DATA: ${{ github.workspace }}/espeak-ng-data
      - name: Golden ratchet
        run: python3 -I tests/golden/check.py

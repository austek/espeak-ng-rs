          --test number_separators_and_fractions
          --test degree_celsius_sign
          --test switched_word_digit_context
          --test albanian_final_z
          --test slovenian_r_vowel
          --test dictionary_named_stress
          --test number_missing_scale_words
          --test hungarian_dot_ordinals
          --test leading_zero_numbers
          --test arabic_thousand_and
          --test ordinal_unknown_suffix
          --test ordinal_composition
          --test ordinal_dot_context
          --test french_liaison_glide
          --test french_letter_suffix
          --test accented_letters
          --test prefix_confirmation
          --test accent_removal
          --test spelled_replacement
          --test dutch_number_word_break
          --test leading_zero_groups
          --test number_before_dash_pause
          --test leading_decimal_point
          --test decimal_comma_repeated
          --test russian_fraction_word_break
          --test hungarian_thousand_break
          --test grouped_decimal_words
          --test dutch_nonsyllabic_tonic
          --test dutch_short_stem_vowel_doubling

          --test number_swap_thousands
          --test mn_omit_one_hundred
          --test numbers_disabled_langs
          --test numbers_ht_bs_sr
          --test numbers_indic_scales
          --test overfit_r4_quote_pause_listed_words
          --test overfit_r4_mixed_script_spelling
          --test overfit_r4_lone_foreign_digit
          --test offset_script_letter_bits
          --test german_time_connector
          --test clause_start_no_leading_space
          --test silent_symbol_clause_word
          --test punctuation_before_any_word
          --test closing_clause_engine
          --test switch_over_silent_entries
          --test cmn_latin_word_tones
          --test yue_ng_initial
          --test switched_letter_name_programs
      - name: C ABI tests
        run: |
          sudo apt-get install -y pkg-config
          cargo test --release -p espeak-ng-capi
      - name: Switch closing tag tests
        run: cargo test --release --test switch_closing_tag -- --ignored
        env:
          ESPEAK_NG_DATA: ${{ github.workspace }}/espeak-ng-data
      - name: Golden ratchet
        run: python3 -I tests/golden/check.py

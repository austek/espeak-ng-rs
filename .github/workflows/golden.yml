name: golden

on:
  push:
    branches: [dengjen]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      ESPEAK_DATA_PATH: ${{ github.workspace }}/espeak-ng-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build release
        run: cargo build --release
      - name: Library tests
        run: cargo test --lib
      - name: Fix-branch tests
        run: >
          cargo test --release
          --test cli_invalid_utf8
          --test cli_data_path
          --test cli_voice_path
          --test cli_voices_list
          --test cli_getopt
          --test cli_messages
          --test cli_voice_select
          --test cli_punct
          --test dictionary_bounds
          --test english_letter_group_y
          --test italian_rule_stress
          --test polish_final_l
          --test long_digit_strings
          --test spanish_group_stress
          --test pt_articles
          --test portuguese_numbers
          --test ipa_from_codes
          --test upstream_1_53_parity
          --test geminates_and_alt_vowels
          --test ku_hundred_link
          --test ku_tr_ru_golden
          --test ru_voice_replace
          --test unspaced_ascii_punctuation
          --test dot_run_ellipsis
          --test robustness_tone_sandhi
          --test robustness_linear_time
          --test robustness_wav_stream
          --test robustness_final_long_stress
          --test robustness_ssml_unterminated_tag
          --test robustness_switch_tables
          --test stress_add_language_table
          --test crash_safety
          --test fuzz_parsers
          --test number_apostrophe_suffix
          --test synth_parity
          --test synth_parity_langs
          --test synth_parity_voicefile
          --test synth_parity_phlist
          --test synth_parity_wordgap
          --test synth_parity_variants
          --test synth_parity_voice_path
          --test tr_phoneme_program_context
          --test tr_next_phoneme_word_end
          --test max_digits
          --test number_group_pause
          --test leading_zero_long_runs
          --test dutch_sch_cluster
          --test dutch_spelled_letters
          --test dutch_pause
          --test dutch_prefix_stress
          --test german_brk_last_word
          --test german_spelled_letters
          --test german_loanword_voicing
          --test dutch_final_devoicing
          --test german_clause_final_devoicing
          --test german_unit_one
          --test dutch_prefix_rule_flags
          --test dutch_dieresis
          --test arabic_syllabic_consonant
          --test arabic_scale_words
          --test lengthened_consonant_position
          --test number_group_stress
          --test number_empty_group_word
          --test number_separators_and_fractions
          --test degree_celsius_sign
          --test number_missing_scale_words
          --test hungarian_dot_ordinals
          --test leading_zero_numbers
          --test arabic_thousand_and
          --test ordinal_unknown_suffix
          --test ordinal_composition
          --test ordinal_dot_context
          --test french_liaison_glide
          --test french_letter_suffix
          --test accented_letters
          --test prefix_confirmation
          --test accent_removal
          --test spelled_replacement
          --test dutch_number_word_break
          --test leading_zero_groups
          --test number_before_dash_pause
          --test leading_decimal_point
          --test decimal_comma_repeated
          --test russian_fraction_word_break
          --test hungarian_thousand_break
          --test grouped_decimal_words
          --test dutch_nonsyllabic_tonic
          --test dutch_short_stem_vowel_doubling
          --test dutch_prefix_confirmation
          --test dutch_first_suffix_match
          --test absent_letters
          --test foreign_script_letters
          --test switched_letter_names
          --test switched_replace
          --test spellword_abort
          --test en_golden_fixes
          --test roman_numerals
          --test dutch_nested_prefix
          --test dutch_article_apostrophe
          --test dutch_phrase_entries
          --test dutch_number_leading_space
          --test dutch_hyphen_compound
          --test dutch_pause_word_voicing
          --test spelled_superscript
          --test pt_listed_fractions
          --test pt_unstressed_word_tonic
          --test italian_golden_fixes
          --test symbol_reading
          --test negative_numbers
          --test number_point
          --test acronym_periods
          --test dotted_abbreviations
          --test dotted_phrase_entries
          --test dot_between_words
          --test hyphen_and_clause_stress
          --test quote_and_dash_pauses
          --test vulgar_fractions
          --test dotted_ordinals
          --test german_ordinals
          --test pt_prev_stress_demotes_primary
          --test pt_spelling_rule_symbol
          --test pt_final_u_glide
          --test pt_underscore_symbols
          --test pt_currency_and_degrees
          --test french_golden_fixes
          --test suffix_keeps_stem_stress
          --test number_single_stress_tens
          --test lengthened_pause_and_repeats
          --test german_prefix_stem_lookup
          --test unpronounceable_next_word
          --test es_unpron_rule_and_roman
          --test letters2
          --test symbol_table_removed
          --test symbol_english_switch
          --test clause_tonic_unstressed_words
          --test clause_leading_punctuation
          --test voice_names
          --test voice_keywords
          --test regressive_voicing_hr
      - name: Switch closing tag tests
        run: cargo test --release --test switch_closing_tag -- --ignored
        env:
          ESPEAK_NG_DATA: ${{ github.workspace }}/espeak-ng-data
      - name: Golden ratchet
        run: python3 -I tests/golden/check.py
